# Codex direct MCP baseline.
# Copy this to apps/angular-demo/.codex/config.toml when measuring direct MCP without proxy.

# Workshop model (project config needs a trusted project). Sol 6.1 is priced in e2e/_lib.ts.
model = "gpt-6.1-sol"

[mcp_servers.jira]
url = "http://localhost:9001/mcp"
startup_timeout_sec = 10
tool_timeout_sec = 60
default_tools_approval_mode = "approve"

[mcp_servers.github]
url = "http://localhost:9002/mcp"
startup_timeout_sec = 10
tool_timeout_sec = 60
default_tools_approval_mode = "approve"

[mcp_servers.confluence]
url = "http://localhost:9003/mcp"
startup_timeout_sec = 10
tool_timeout_sec = 60
default_tools_approval_mode = "approve"

[mcp_servers.sentry]
url = "http://localhost:9004/mcp"
startup_timeout_sec = 10
tool_timeout_sec = 60
default_tools_approval_mode = "approve"

[mcp_servers.testrail]
url = "http://localhost:9005/mcp"
startup_timeout_sec = 10
tool_timeout_sec = 60
default_tools_approval_mode = "approve"
